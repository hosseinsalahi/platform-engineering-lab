# Phase 3: the guardrails were generated by the platform, not applied by hand -
# Kyverno owns them, so they carry its generate labels and are restored if deleted
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 180
commands:
  - script: |
      kubectl get resourcequota golden-path-quota -n cnpe-devex-team \
        -o jsonpath='{.metadata.labels}' | grep -q 'kyverno'
  - script: |
      kubectl get namespace cnpe-devex-team \
        -o jsonpath='{.metadata.labels.platform\.cnpe\.io/golden-path}' | grep -q true
