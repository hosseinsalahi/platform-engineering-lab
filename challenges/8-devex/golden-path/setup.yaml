apiVersion: v1
kind: Namespace
metadata:
  name: cnpe-devex-team
---
# BROKEN: this policy is the platform's "golden path" - a team labels its
# namespace and the platform fills in the guardrails. Teams report that labelling
# their namespace does nothing.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: golden-path-namespace
spec:
  background: true
  rules:
    - name: add-resource-quota
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  # BUG 1: the documented opt-in label is
                  # platform.cnpe.io/golden-path, so this selector never matches.
                  golden-path: "true"
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: golden-path-quota
        # BUG 2: hardcoded, so every team's quota would land in one namespace
        # instead of their own.
        namespace: default
        synchronize: true
        data:
          spec:
            hard:
              requests.cpu: "2"
              requests.memory: 4Gi
              pods: "20"
    - name: add-default-deny
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  golden-path: "true"
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-ingress
        namespace: default
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
