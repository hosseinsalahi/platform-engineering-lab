apiVersion: v1
kind: Namespace
metadata:
  name: tenant-alpha
  labels:
    tenant: alpha
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-beta
  labels:
    tenant: beta
---
# Stand-in for a monitoring tenant. Deliberately NOT named "monitoring": a
# challenge that declares a shared platform namespace also deletes it on cleanup,
# which would uninstall kube-prometheus-stack. The NetworkPolicy selects on the
# purpose label, not the name, so the scenario is unchanged.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpe-monitoring
  labels:
    purpose: monitoring
---
# Frontend pod in tenant-alpha
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: tenant-alpha
  labels:
    app: frontend
    tier: web
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
---
# Backend pod in tenant-alpha
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: tenant-alpha
  labels:
    app: backend
    tier: api
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 8080
    - containerPort: 9090
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
---
# Pod in tenant-beta (should be isolated)
apiVersion: v1
kind: Pod
metadata:
  name: workload
  namespace: tenant-beta
  labels:
    app: workload
spec:
  containers:
  - name: nginx
    image: nginx:alpine
