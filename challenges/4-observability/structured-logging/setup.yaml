apiVersion: v1
kind: Namespace
metadata:
  name: cnpe-logging
---
# BROKEN: The checkout-worker writes JSON logs to a file, but the log-streamer
# sidecar mounts the shared volume at the wrong path and the pod template
# annotations disable log scraping.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-worker
  namespace: cnpe-logging
  labels:
    app: checkout-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-worker
  template:
    metadata:
      labels:
        app: checkout-worker
      annotations:
        # BUG 1: scraping is disabled and log format annotation is missing
        logging.cnpe.io/scrape: "false"
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                printf '{"level":"info","service":"checkout","msg":"order processed"}\n' >> /var/log/app/app.log
                sleep 5
              done
          volumeMounts:
            - name: varlog
              mountPath: /var/log/app
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
        - name: log-streamer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - tail -n+1 -F /var/log/app/app.log
          volumeMounts:
            # BUG 2: wrong mountPath - should be /var/log/app
            - name: varlog
              mountPath: /wrong/path
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: varlog
          emptyDir: {}
