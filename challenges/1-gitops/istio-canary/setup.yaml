apiVersion: v1
kind: Namespace
metadata:
  name: cnpe-istio-canary
---
apiVersion: v1
kind: Service
metadata:
  name: echo-stable
  namespace: cnpe-istio-canary
spec:
  selector:
    app: echo
  ports:
  - name: http
    port: 80
    targetPort: 5678
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: echo-canary
  namespace: cnpe-istio-canary
spec:
  selector:
    app: echo
  ports:
  - name: http
    port: 80
    targetPort: 5678
    protocol: TCP
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: echo
  namespace: cnpe-istio-canary
spec:
  gateways:
  - echo-gateway
  hosts:
  - "*"
  http:
  - name: primary
    route:
    - destination:
        host: echo-stable
      weight: 100
    - destination:
        host: echo-canary
      weight: 0
---
# BUG: spec.host points at "echo", but no such Service exists — the stable Service is
# named "echo-stable". Istio silently drops a DestinationRule whose host does not
# resolve, so the subsets below are never applied to canary traffic.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo
  namespace: cnpe-istio-canary
spec:
  host: echo
  subsets:
  - name: stable
    labels:
      app: echo
  - name: canary
    labels:
      app: echo
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: echo
  namespace: cnpe-istio-canary
spec:
  replicas: 2
  strategy:
    canary:
      canaryService: echo-canary
      stableService: echo-stable
      trafficRouting:
        istio:
          virtualService:
            name: echo
            routes:
            - primary
      steps:
      - setWeight: 10
      - pause: {}
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo
        args:
        - "-text=hello"
        ports:
        - containerPort: 5678
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
