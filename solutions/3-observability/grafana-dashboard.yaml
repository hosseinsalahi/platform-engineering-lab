apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpe-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cnpe-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total[5m])",
              "refId": "A"
            }
          ],
          "title": "CPU Usage",
          "type": "graph"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "",
      "title": "Platform Dashboard",
      "uid": "cnpe-dashboard",
      "version": 0
    }
