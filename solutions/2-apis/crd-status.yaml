apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaseclaims.platform.cnpe.io
spec:
  group: platform.cnpe.io
  names:
    kind: DatabaseClaim
    plural: databaseclaims
    singular: databaseclaim
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - engine
            - size
            properties:
              engine:
                type: string
                enum: [postgres, mysql, mongodb]
              size:
                type: string
                enum: [small, medium, large]
          status:
            type: object
            properties:
              phase:
                type: string
              conditions:
                type: array
                items:
                  type: object
---
apiVersion: platform.cnpe.io/v1
kind: DatabaseClaim
metadata:
  name: test-db
  namespace: cnpe-crd-status-test
spec:
  engine: postgres
  size: medium
# The last assert checks status.phase, and with the status subresource enabled
# `kubectl apply` drops .status. Set it through the subresource after applying:
#   kubectl patch databaseclaim test-db -n cnpe-crd-status-test \
#     --type=merge --subresource=status -p '{"status":{"phase":"Ready"}}'
