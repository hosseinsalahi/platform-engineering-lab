apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-worker
  namespace: cnpe-logging
  labels:
    app: checkout-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-worker
  template:
    metadata:
      labels:
        app: checkout-worker
      annotations:
        logging.cnpe.io/scrape: "true"
        logging.cnpe.io/format: "json"
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                printf '{"level":"info","service":"checkout","msg":"order processed"}\n' >> /var/log/app/app.log
                sleep 5
              done
          volumeMounts:
            - name: varlog
              mountPath: /var/log/app
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
        - name: log-streamer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - tail -n+1 -F /var/log/app/app.log
          volumeMounts:
            - name: varlog
              mountPath: /var/log/app
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: varlog
          emptyDir: {}
