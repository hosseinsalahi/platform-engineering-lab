    domain: "Platform Architecture (15%)"
    minutes: 15
    challenge: "1-architecture/storage-class"
    objective: "Configure StorageClass for persistent storage."
  - id: "arch-mesh"
    domain: "Platform Architecture (15%)"
    minutes: 15
    challenge: "1-architecture/service-mesh"
    objective: "Configure Istio VirtualService traffic splitting."
  - id: "arch-fault"
    domain: "Platform Architecture (15%)"
    minutes: 15
