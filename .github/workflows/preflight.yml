name: Preflight

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run preflight checks
        run: python3 scripts/preflight.py

      - name: Check markdown links
        run: python3 scripts/check-md-links.py

      - name: Run shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x scripts/*.sh

      - name: Run yamllint
        run: |
          pip install yamllint
          yamllint -c .yamllint .

  integration-test:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Platform Tools
        run: |
          sudo ./scripts/install-cli.sh --apply
          # Ensure install paths are in PATH for subsequent steps
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Provision Cluster
        run: ./scripts/provision-cluster.sh --minimal

      - name: Run Smoke Test
        run: |
          # Manually setup challenge and apply solution (simulating user action)
          kubectl apply -f challenges/0-test/simple-pod/setup.yaml
          kubectl apply -f solutions/0-test/simple-pod.yaml
          
          # Run KUTTL to verify assertions
          kubectl kuttl test challenges/0-test --test simple-pod --config challenges/0-test/kuttl-test.yaml
